[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock-cli"
version = "0.1.0"
description = "A simple CLI alarm clock — no persistence, no dependencies."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
alarm-clock = "alarm_clock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]